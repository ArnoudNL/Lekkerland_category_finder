<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E6001A">
<meta name="description" content="Zoek en kopieer categoriecodes voor het C4C ticketsysteem.">
<meta name="author" content="Arnoud van Rooij">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%23E6001A'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='6'%20fill='none'%20stroke='%23fff'%20stroke-width='3'/%3E%3Cpath%20d='M19%2019l7%207'%20stroke='%23fff'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
<title>C4C Categoriekiezer</title>
<style>
:root{--red:#E6001A;--red-d:#AE0E16;--ink:#2A2E38;--g1:#555A64;--g2:#82868F;--g3:#ACB1B8;--g4:#D6DBDF;--g5:#EAEBEB;--bg:#F4F5F5}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh,90px) + 12px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{position:-webkit-sticky;position:sticky;top:0;z-index:40;background:#fff;border-bottom:4px solid var(--red);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:20px;padding:12px 0}
.top img{height:56px;width:auto;display:block}
.top h1{margin:0;font-size:1.5rem;font-weight:600;color:var(--ink)}
.top p{margin:2px 0 0;color:var(--g1);font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:16px 32px;margin:20px 0 14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>span{font-size:.85rem;color:var(--g1);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:9px 16px;font-weight:600;color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
@media(hover:hover){.seg button:hover:not([aria-pressed=true]){background:var(--g5)}}
.searchbox{position:relative}
.searchbox>svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--g1);fill:none;stroke-width:2.2;pointer-events:none}
#q{width:100%;-webkit-appearance:none;appearance:none;font:inherit;font-size:1.15rem;padding:16px 56px 16px 50px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
#q::placeholder{color:var(--g2)}
#q:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(230,0,26,.18)}
#clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:radial-gradient(circle,var(--g5) 15px,transparent 16px);border-radius:50%;width:44px;height:44px;font-size:1.3rem;line-height:1;color:var(--g1);display:none}
@media(hover:hover){#clear:hover{background:radial-gradient(circle,var(--g4) 15px,transparent 16px)}}
#sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:2px solid var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(42,46,56,.2);z-index:20;max-height:70vh;overflow:auto;display:none}
.sg{display:block;width:100%;text-align:left;cursor:pointer;border:0;border-bottom:1px solid var(--g5);background:#fff;padding:11px 16px}
.sg:last-child{border-bottom:0}
.sg.on{background:var(--g5)}@media(hover:hover){.sg:hover{background:var(--g5)}}
.sg .r1{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sg b{font-weight:600}
.sg .path{font-size:.85rem;color:var(--g1)}
.sg .df{font-size:.9rem;color:var(--g1);margin-top:2px}
.sg .cd,.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;font-size:.85rem}
.sg .cd{color:var(--g1);white-space:nowrap}
mark{background:rgba(230,0,26,.15);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:16px;color:var(--g1)}
main{padding:8px 0 48px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.bar h2{margin:0;font-size:1.1rem;font-weight:600}
.bar small{color:var(--g1);font-weight:400;margin-left:6px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:7px 14px;font-weight:600}
@media(hover:hover){.btn:hover{background:var(--ink);color:#fff}}
.note{display:flex;align-items:center;gap:10px;background:#fff;border-left:4px solid var(--red);padding:10px 14px;margin:0 0 12px;color:var(--g1);border-radius:0 6px 6px 0}
.cat{background:#fff;border:2px solid var(--g4);border-radius:10px;margin-bottom:10px;transition:opacity .2s,filter .2s,border-color .2s}
.cat.open{border-color:var(--ink)}
.cat.dim{opacity:.45;filter:grayscale(1)}
@media(hover:hover){.cat.dim:hover{opacity:.8}}
.head{display:flex;align-items:center;gap:8px;padding-right:12px}
.tg{flex:1;display:flex;align-items:center;gap:14px;border:0;background:none;text-align:left;padding:14px 8px 14px 14px;min-width:0}
.ltr{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600}
.cat.open .ltr{background:var(--red)}
.tx{min-width:0}
.tx .n{font-size:1.15rem;font-weight:600}
.tx .d{color:var(--g1);font-size:.92rem;margin-top:1px}
.cnt{color:var(--g2);font-size:.85rem;white-space:nowrap}
.chev{flex:none;width:12px;height:12px;border-right:3px solid var(--g1);border-bottom:3px solid var(--g1);transform:rotate(-45deg);transition:transform .15s;margin:0 6px}
.cat.open .chev{transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--g3);background:var(--g5);border-radius:6px;padding:3px 8px;color:var(--ink);white-space:nowrap}
@media(hover:hover){.chip:hover{border-color:var(--ink);background:#fff}}
.subs{display:none;border-top:1px solid var(--g4);padding:6px 14px 10px 62px}
.cat.open .subs{display:block}
.sub{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:10px 10px;border-bottom:1px solid var(--g5);border-radius:6px}
.sub:last-child{border-bottom:0}
.sub .n{font-weight:600}
.sub .d{color:var(--g1);font-size:.95rem}
.sub.hit,.head.hit{animation:hit 2.6s ease-out}
@keyframes hit{0%,60%{background:rgba(230,0,26,.14);box-shadow:inset 4px 0 0 var(--red)}100%{background:transparent;box-shadow:inset 4px 0 0 transparent}}
.chip svg{width:13px;height:13px;stroke:var(--g1);fill:none;stroke-width:2;flex:none}
.dp{display:inline-block;font-size:.75rem;font-weight:600;color:#fff;background:var(--g1);border-radius:4px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.oth{padding:8px 16px;background:var(--g5);color:var(--g1);font-size:.85rem;font-weight:600;border-top:1px solid var(--g4);border-bottom:1px solid var(--g4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wi{flex:none;width:22px;height:22px;fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
footer{background:#fff;border-top:1px solid var(--g4);padding:18px 0 calc(28px + env(safe-area-inset-bottom,0px));color:var(--g1);font-size:.88rem}
footer .meta{display:flex;flex-wrap:wrap;gap:4px 24px}
@media(pointer:coarse){.chip{min-height:40px}.seg button,.btn{min-height:44px}.sg{padding:14px 16px}.tg{min-height:56px}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){.subs{padding-left:14px}.sub{flex-direction:column;gap:6px}.cnt{display:none}.head{flex-wrap:wrap;padding-bottom:10px}.tg{flex:1 1 100%}.head .chip{margin-left:52px}.top{padding:8px 0;gap:12px}.top img{height:40px}.top h1{font-size:1.15rem}.top p{display:none}.controls{gap:12px;margin-top:14px}.grp{width:100%}.seg{display:flex;width:100%}.seg button{flex:1;padding:9px 6px;font-size:.92rem;line-height:1.2}#sug{max-height:50vh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function toggleCat(i){

 else{open=new Set([i]);focus=true}

}
function toggleAll(){

 if(open.size===n){open.clear();focus=false}else{open=new Set(DATA[dept].cats.map((_,i)=>i));focus=false}

}
let toastT;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1800)}
function copy(code){
 const done=()=>toast(T[lang].copied+code);
 const fb=()=>{const a=document.createElement("textarea");a.value=code;a.setAttribute("readonly","");a.style.cssText="position:fixed;top:0;left:0;font-size:16px;opacity:0";document.body.appendChild(a);a.select();a.setSelectionRange(0,code.length);try{document.execCommand("copy")}catch(e){}a.remove();done()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(code).then(done,fb);else fb();
}

/* afstand tussen woorden (1 typfout of omgewisselde letters telt als 1) */
function dist(a,b,max){
 if(Math.abs(a.length-b.length)>max)return max+1;
 const m=a.length,n=b.length;let p2=null,p1=[];
 for(let j=0;j<=n;j++)p1[j]=j;
 for(let i=1;i<=m;i++){
  const c=[i];
  for(let j=1;j<=n;j++){
   let v=Math.min(p1[j]+1,c[j-1]+1,p1[j-1]+(a[i-1]===b[j-1]?0:1));
   if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);
   c[j]=v;
  }
  p2=p1;p1=c;
 }
 return p1[n];
}
/* herkent een code ook met extra tekens erachter, bijv. "nl-as-1010Lm" of "NL AS 1010" */
function extractCode(q){
 const m=q.toUpperCase().match(/NL[\s-]?(AS|EV|KS)[\s-]?(\d{4}|[A-Z]{2})/);
 return m?"NL-"+m[1]+"-"+m[2]:null;
}
function itemsOf(k){
 const out=[];
 DATA[k].cats.forEach((c,i)=>{
  out.push({dk:k,i,j:-1,name:catName(c),def:catDef(c),code:c.c,cat:""});
  c.s.forEach((s,j)=>out.push({dk:k,i,j,name:subName(s),def:subDef(s),code:s[4],cat:catName(c)}));
 });
 return out;
}
const wordsOf=it=>norm(it.name+" "+it.cat+" "+it.def).split(/[^a-z0-9]+/).filter(w=>w.length>2);
function search(q,k,limit){
 const tokens=stripQ(q).split(/\s+/).filter(Boolean);if(!tokens.length)return[];
 const out=[];
 for(const it of itemsOf(k)){
  const n=norm(it.name),d=norm(it.def),cd=norm(it.code),cn=norm(it.cat);let sc=0,ok=true,ws=null;
  for(const t of tokens){
   let s=0;
   if(cd===t)s+=100;else if(cd.endsWith("-"+t))s+=70;else if(cd.includes(t))s+=40;
   if(n===t)s+=90;else if(n.startsWith(t))s+=60;else if((" "+n).includes(" "+t))s+=45;else if(n.includes(t))s+=30;
   if(cn.includes(t))s+=12;
   if(d.includes(t))s+=(" "+d).includes(" "+t)?14:9;
   if(!s){
    const md=t.length>=8?2:(t.length>=5?1:0);
    if(md){ws=ws||wordsOf(it);for(const w of ws){if(Math.min(dist(t,w,md),dist(t,w.slice(0,t.length),md))<=md){s=8;break}}}
   }
   if(!s){ok=false;break}sc+=s;
  }
  if(ok)out.push({...it,sc:sc+(it.j>=0?1:0)});
 }
 return out.sort((a,b)=>b.sc-a.sc).slice(0,limit);
}
/* eigen afdeling eerst; alleen bij geen resultaat ook de andere afdelingen */
function lookup(q){
 const cd=extractCode(q);
 if(cd){for(const k of DEPT_ORDER){const hit=itemsOf(k).find(it=>it.code===cd);if(hit)return k===dept?{own:[hit],other:[]}:{own:[],other:[hit]}}}
 const own=search(q,dept,8);
 if(own.length)return{own,other:[]};
 let other=[];
 DEPT_ORDER.forEach(k=>{if(k!==dept)other=other.concat(search(q,k,3))});
 return{own:[],other:other.slice(0,6)};
}
function hl(text,q){
 let h=esc(text);
 q.trim().split(/\s+/).filter(t=>t.length>0).forEach(t=>{
  const r=new RegExp("("+esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![^<]*>)","ig");
  h=h.replace(r,"<mark>$1</mark>");
 });
 return h;
}
function renderSug(hide){
 const box=$("sug"),q=$("q").value,t=T[lang];
 $("clear").style.display=q?"block":"none";
 if(hide||!stripQ(q)){showSug(false);results=[];setStatus("");return}
 const r=lookup(q);
 results=r.own.concat(r.other);cursor=results.length?0:-1;
 const row=(x,k)=>`<div class="sg${k===cursor?" on":""}" id="sg-${k}" data-k="${k}" role="option" aria-selected="${k===cursor}">
  <div class="r1"><span><b>${hl(x.name,q)}</b> <span class="path">${x.j<0?esc(t.main):esc(x.cat)}</span>${x.dk!==dept?` <span class="dp">${esc(deptName(x.dk))}</span>`:""}</span><button class="chip" data-copy="${esc(x.code)}" title="${esc(t.copy)}" aria-label="${esc(t.copy)} ${esc(x.code)}">${hl(x.code,q)}${copyIcon}</button></div>
  ${x.def?`<div class="df">${hl(x.def.length>110?x.def.slice(0,107)+"…":x.def,q)}</div>`:""}</div>`;
 let html="";
 if(r.own.length){
  html=r.own.map((x,k)=>row(x,k)).join("");
  setStatus(r.own.length+" "+t.res);
 }else{
  const msg=`${t.none} "${q.trim()}" ${t.at} ${deptName(dept)}`;
  html=`<div class="empty"><b>${esc(msg)}</b>${r.other.length?"":`<br>${esc(t.tip)}`}</div>`;
  if(r.other.length)html+=`<div class="oth">${esc(t.others)}</div>`+r.other.map((x,n)=>row(x,n)).join("");
  setStatus(msg+(r.other.length?". "+t.others:""));
 }
 box.innerHTML=html;
 showSug(true);
 if(results.length)$("q").setAttribute("aria-activedescendant","sg-0");else $("q").removeAttribute("aria-activedescendant");
}
function choose(k){
 const r=results[k];if(!r)return;
 if(r.dk!==dept){dept=r.dk;renderStatic()}
 open=new Set([r.i]);focus=true;renderList();
 showSug(false);
 const el=$(r.j<0?"h-"+r.i:"s-"+r.i+"-"+r.j);
 if(el){el.scrollIntoView({block:"center",behavior:window.matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});el.classList.add("hit")}
}
function moveCursor(d){
 if(!results.length)return;
 cursor=(cursor+d+results.length)%results.length;
 document.querySelectorAll(".sg").forEach((e,k)=>{
  const on=k===cursor;e.classList.toggle("on",on);e.setAttribute("aria-selected",on?"true":"false");
  if(on){e.scrollIntoView({block:"nearest"});$("q").setAttribute("aria-activedescendant",e.id)}
 });
}
/* hoogte van de vaste kop doorgeven, zodat scrollen naar een categorie niet onder de kop belandt */
function setHH(){document.documentElement.style.setProperty("--hh",$("hdr").offsetHeight+"px")}
window.addEventListener("resize",setHH);window.addEventListener("load",setHH);

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-copy]");if(c){copy(c.dataset.copy);$("q").value="";renderSug(true);return}
 const g=e.target.closest("[data-cat]");if(g){toggleCat(+g.dataset.cat);return}
 const d=e.target.closest("[data-dept]");
 if(d&&d.dataset.dept!==dept){dept=d.dataset.dept;open.clear();focus=false;$("q").value="";renderAll();refocus('[data-dept="'+dept+'"]');return}
 const l=e.target.closest("[data-lang]");
 if(l&&l.dataset.lang!==lang){lang=l.dataset.lang;renderAll();refocus('[data-lang="'+lang+'"]');return}
 const s=e.target.closest(".sg");if(s){choose(+s.dataset.k);return}
 if(!e.target.closest(".searchbox"))showSug(false);
});
$("toggleAll").onclick=toggleAll;
$("q").addEventListener("input",()=>renderSug(false));
$("q").addEventListener("focus",()=>{if($("q").value.trim())renderSug(false)});
$("q").addEventListener("keydown",e=>{
 if(e.key==="ArrowDown"){e.preventDefault();moveCursor(1)}
 else if(e.key==="ArrowUp"){e.preventDefault();moveCursor(-1)}
 else if(e.key==="Enter"){e.preventDefault();choose(cursor)}
 else if(e.key==="Escape"){showSug(false)}
});
$("clear").onclick=()=>{$("q").value="";renderSug(true);$("q").focus()};
renderAll();
$("q").focus();
</script>
