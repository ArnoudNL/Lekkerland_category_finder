[project]
name = "lekkerland-category-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.ruff]
lint.select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
line-length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
